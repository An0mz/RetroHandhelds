name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build and test (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # Also runs the unit tests, including loading the bundled Linux core.
      - name: Build
        run: ./gradlew build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: retrohandhelds-jar
          path: build/libs/*.jar

  native-cores:
    # Each bundled core is only ever loaded for real on its own platform; this is that check.
    name: Core check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: macos-arm64
            os: macos-latest
          - platform: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test
